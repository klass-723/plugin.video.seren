name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@28f83620103c48a57093dcc2837eec89e036bb9f
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          additional_permissions: |
            actions: read

          allowed_tools: "Bash(python3 -m compileall -q resources/lib seren.py service.py),Bash(pip install ruff),Bash(ruff check --select E9,F63,F7,F82 .)"

          custom_instructions: |
            This is a maintained fork of Seren — a Kodi video addon (Python 3,
            Kodi 19-21) integrating Trakt and debrid services.
            - Trakt sync endpoints enforce pagination (trakt/trakt-api#775);
              all multi-item Trakt calls go through get_all_pages_json or
              get_all_pages_flat. sync/watched/shows uses extended=progress.
            - Install/update docs live in INSTALL.md; users install via the
              Kodi repository at https://klass-723.github.io/packages/.
            - When triaging bug reports, ask for kodi.log and kodi.old.log and
              the exact Seren menu path that failed — and remind users to
              REDACT Trakt/debrid tokens before posting logs.
            - A blank menu is often Kodi's own watched-status filter or an
              account with no data of that type, not a Seren bug.
