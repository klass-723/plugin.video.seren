name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'Existing tag to (re)publish to the Kodi repo, eg. v3.0.68'
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax check
        run: python -m compileall -q resources/lib seren.py service.py

      - name: Lint (syntax errors and undefined names only)
        run: |
          pip install --quiet ruff
          ruff check --select E9,F63,F7,F82 .

      - name: Validate XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for f in ("addon.xml", "resources/settings.xml"):
              ET.parse(f)
          print("XML OK")
          PY

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build addon zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git archive --prefix="plugin.video.seren/" -o "plugin.video.seren-${VERSION}.zip" "$GITHUB_REF_NAME"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="plugin.video.seren-${VERSION}.zip"
          awk '/^Changelog/{c++} c==1' changelog.txt > release-notes.txt
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --title "Seren ${VERSION}" --notes-file release-notes.txt \
            || gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber

  publish-kodi-repo:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build addon zip from tag
        env:
          PUBLISH_TAG: ${{ github.event.inputs.publish_tag || github.ref_name }}
        run: |
          TAG="$PUBLISH_TAG"
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          git archive --prefix="plugin.video.seren/" -o "plugin.video.seren-${VERSION}.zip" "$TAG"

      - name: Checkout Kodi repo
        uses: actions/checkout@v4
        with:
          repository: klass-723/klass-723.github.io
          ssh-key: ${{ secrets.PAGES_DEPLOY_KEY }}
          path: pages

      - name: Update Kodi repo
        run: python3 scripts/update_kodi_repo.py pages/packages "plugin.video.seren-${VERSION}.zip"

      - name: Push if changed
        run: |
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Kodi repo already up to date"; exit 0; }
          git commit -m "Seren ${VERSION}"
          git push
