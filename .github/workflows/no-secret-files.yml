name: no-secret-files

# Blocks pushes and PRs that add local logs, captures, or credential-bearing
# files to the repo. Seren handles Trakt/debrid auth tokens on devices, so a
# stray kodi.log or userdata settings.xml can leak accounts.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: no-secret-files-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Block local and credential-bearing files
        run: |
          set -e
          BAD=$(git ls-files | grep -iE '(^|/)(kodi[^/]*\.log|[^/]*\.env([^/]*)?|[^/]*credentials[^/]*|guisettings\.xml|PXL_[^/]*\.(jpg|jpeg)|Screenshot[^/]*\.png|chatgpt[^/]*\.md)$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Forbidden files tracked in git:"
            echo "$BAD"
            exit 1
          fi

      - name: Scan for committed auth tokens
        run: |
          set -e
          HITS=$(git grep -nE '<setting id="(trakt\.(auth|refresh)|rd\.(auth|refresh)|premiumize\.token|alldebrid\.apikey)"[^>]*>[A-Za-z0-9]{16,}' -- '*.xml' || true)
          if [ -n "$HITS" ]; then
            echo "::error::Possible auth tokens committed:"
            echo "$HITS"
            exit 1
          fi
          echo "clean"
